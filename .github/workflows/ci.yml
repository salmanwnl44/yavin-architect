name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: architect
          POSTGRES_PASSWORD: architect
          POSTGRES_DB: architect
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U architect -d architect"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      ARCHITECT_DATABASE_URL: postgresql://architect:architect@localhost:5432/architect
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Phase 0 contracts validate
        run: python3 phase0-contracts/validate.py
      - name: Phase 0 fixture replays
        run: python3 phase0-contracts/fixture/replay.py
      - run: ruff check .
      - name: Install the Temporal CLI and start a dev server (sessions, M6)
        run: |
          curl -sSf https://temporal.download/cli.sh | sh
          echo "$HOME/.temporalio/bin" >> "$GITHUB_PATH"
          "$HOME/.temporalio/bin/temporal" server start-dev --headless --log-level warn --port 7233 &
          for i in $(seq 1 60); do
            if "$HOME/.temporalio/bin/temporal" operator cluster health --address localhost:7233 >/dev/null 2>&1; then break; fi
            sleep 1
          done
          "$HOME/.temporalio/bin/temporal" operator cluster health --address localhost:7233
      - run: pytest -v
        env:
          ARCHITECT_TEMPORAL_ADDRESS: localhost:7233
