services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: architect
      POSTGRES_PASSWORD: architect
      POSTGRES_DB: architect
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U architect -d architect"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Durable-workflow engine for design sessions (spec §13, module M6).
  #   docker compose --profile sessions up -d     # Postgres plus this dev server
  #   architect worker                            # then start a session: architect session start
  # The UI is at http://localhost:8233; the SDK address is localhost:7233
  # (ARCHITECT_TEMPORAL_ADDRESS). The dev server keeps its history in memory.
  temporal:
    image: temporalio/temporal:latest
    profiles: ["sessions"]
    command: ["server", "start-dev", "--ip", "0.0.0.0"]
    ports:
      - "7233:7233"
      - "8233:8233"

volumes:
  pgdata:
