[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yavin-architect"
version = "0.1.0"
description = "Yavin Architect: the design-verification harness. Milestone 1 is the ledger and the Arbiter."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "jsonschema>=4.23",
    "psycopg[binary,pool]>=3.2",
    "python-ulid>=2.7",
    "referencing>=0.35",
    "rfc3339-validator>=0.1.4",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "httpx2",
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
architect = "architect.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/architect"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
# phase0-contracts/ is frozen (v1.0): it is never edited, so it is never linted either.
extend-exclude = ["phase0-contracts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["architect", "builders", "conftest"]
