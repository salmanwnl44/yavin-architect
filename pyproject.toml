[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yavin-architect"
version = "0.1.0"
description = "Yavin Architect: the design-verification harness. Milestone 1 is the ledger and the Arbiter."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.11",
    "fastapi>=0.115",
    "httpx2",
    "jsonschema>=4.23",
    "psycopg[binary,pool]>=3.2",
    "pymupdf>=1.26",
    "python-multipart>=0.0.9",
    "python-ulid>=2.7",
    "pyyaml>=6",
    "referencing>=0.35",
    "rfc3339-validator>=0.1.4",
    "rich>=13",
    "temporalio>=1.34",
    "uvicorn>=0.30",
    # the knowledge plane (M8): exact vector search, Leiden communities
    "numpy>=1.26",
    "python-igraph>=0.11",
    "leidenalg>=0.10",
]

[project.optional-dependencies]
# local CPU embeddings (ONNX): the on-prem default of the embedding tier
embeddings = [
    "fastembed>=0.4",
]
dev = [
    "httpx2",
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
architect = "architect.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/architect"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# live tests call a real model provider; they are deselected (not skipped) unless asked for
addopts = "-ra -m \"not live\""
markers = [
    "live: calls a real model provider with a real key; run with: pytest -m live -v",
    "live_openai_compat: needs an OpenAI-compatible server; deselected unless OPENAI_COMPAT_BASE_URL is set",
    "needs_age: needs the Apache AGE extension in the test database; deselected without it",
    "needs_pgvector: needs the pgvector extension in the test database; deselected without it",
    "fastembed_smoke: embeds with the optional fastembed package; deselected unless it is installed",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# phase0-contracts/ is frozen (v1.0): it is never edited, so it is never linted either.
extend-exclude = ["phase0-contracts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = [
    "architect", "builders", "conftest", "ingest_fixtures", "knowledge_fixtures", "replay_reference",
    "session_fixtures", "test_m8_graph", "test_projections",
]
